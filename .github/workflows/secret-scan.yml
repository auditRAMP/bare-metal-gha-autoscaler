name: Credential Scan

# The enforcing layer. The pre-commit hook is advisory — it is per-clone, and
# --no-verify skips it. This runs the SAME script on the server, so a credential
# cannot reach main whatever happened locally. Wire it into the branch ruleset's
# required status checks to make that binding.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the scan needs the merge base, not a shallow tip

      - name: Scan changed lines
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          else
            RANGE="${{ github.event.before }}..HEAD"
          fi
          echo "Scanning $RANGE"
          ./.githooks/secret-guard.sh --range "$RANGE"
